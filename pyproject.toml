[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datum-backend"
version = "0.1.0"
description = "Deterministic data analysis backend for DATUM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "openpyxl>=3.1,<4",
  "pyarrow>=17,<20",
  "python-multipart>=0.0.9,<1",
  "langgraph>=0.6,<0.7",
  "langgraph-checkpoint-sqlite>=2,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "nbformat>=5.10,<6",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
sql-postgres = ["psycopg[binary]>=3.2,<4"]
sql-mysql = ["pymysql>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
